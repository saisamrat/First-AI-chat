[api]
base_url = "https://api.groq.com/openai/v1/chat/completions"
model = "llama-3.3-70b-versatile"
key_env_var = "GROQ_API_KEY"
timeout_seconds = 30
temperature = 0.7

[chat]
max_history_messages = 20
history_dir = "data/history"

[autosave]
enabled = true

[logging]
level = "INFO"
file_path = "logs/chat.log"